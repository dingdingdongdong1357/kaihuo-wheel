<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>開伙轉盤</title>
<meta name="theme-color" content="#D9503A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="開伙轉盤">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one phone-width column; wheel up top on the home tab, cards below, tab bar pinned to the bottom for thumbs.
   Palette from a home kitchen: tomato (action), egg yolk (mastery), leaf (progress), sky (beginner). */
:root{
  --bg:#EEF3EC; --surface:#FFFFFF; --ink:#24302A; --muted:#667369; --line:#DCE5DC;
  --tomato:#D9503A; --tomato-soft:#FBE3DD; --yolk:#C98A0C; --yolk-bright:#F2B634; --yolk-soft:#FCEFCB;
  --leaf:#2F7D4F; --leaf-soft:#DCEFE2; --sky:#3D79B8; --sky-soft:#E0EBF7; --shadow:0 1px 2px rgb(36 48 42 / .06),0 4px 14px rgb(36 48 42 / .06);
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Nunito","Noto Sans TC",ui-rounded,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131915; --surface:#1C2420; --ink:#E7EEE9; --muted:#9BAAA1; --line:#2C3832;
  --tomato:#FF7B64; --tomato-soft:#3B221D; --yolk:#F5C451; --yolk-bright:#F5C451; --yolk-soft:#3A3018;
  --leaf:#6CC690; --leaf-soft:#1C3527; --sky:#88B5E8; --sky-soft:#1C2B3C; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131915; --surface:#1C2420; --ink:#E7EEE9; --muted:#9BAAA1; --line:#2C3832;
  --tomato:#FF7B64; --tomato-soft:#3B221D; --yolk:#F5C451; --yolk-bright:#F5C451; --yolk-soft:#3A3018;
  --leaf:#6CC690; --leaf-soft:#1C3527; --sky:#88B5E8; --sky-soft:#1C2B3C; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:24px;font-weight:900;letter-spacing:.01em}
h2{font-size:18px;font-weight:900}
h3{font-size:15px;font-weight:700}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:13px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--tomato);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:500}
.btn.primary{background:var(--tomato);border-color:var(--tomato);color:#fff;font-weight:700}
.btn.big{font-size:17px;padding:13px 20px;border-radius:16px;width:100%}
.btn.on{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf);font-weight:700}
.btn.no{background:var(--tomato-soft);border-color:var(--tomato);color:var(--tomato);font-weight:700;text-decoration:line-through}
.btn.tiny{padding:3px 10px;font-size:12.5px;border-radius:9px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.brand{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.12em}
.pill{border:0;border-radius:999px;padding:6px 12px;font-size:13px;background:var(--leaf-soft);color:var(--leaf);font-weight:700;white-space:nowrap}
.pill.over{background:var(--tomato-soft);color:var(--tomato)}
.hint{border:0;border-radius:12px;background:var(--yolk-soft);color:var(--yolk);font-weight:700;font-size:13px;padding:8px 12px;width:100%;text-align:left;margin-bottom:12px}

/* wheel */
.wheelcard{display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:18px}
.wheelwrap{position:relative;width:min(78vw,300px);aspect-ratio:1;max-width:100%}
.wheelwrap canvas{width:100%;height:100%;display:block;border-radius:50%;will-change:transform}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--tomato);filter:drop-shadow(0 2px 2px rgb(0 0 0 / .2));z-index:2}
.hub{position:absolute;inset:0;margin:auto;width:30%;height:30%;border-radius:50%;background:var(--surface);border:3px solid var(--tomato);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:700;line-height:1.3;padding:4px;color:var(--ink);z-index:1}
.result{min-height:26px;font-weight:700;text-align:center}
.result b{color:var(--tomato)}
.spinrow{display:flex;gap:8px;width:100%}
.spinrow .btn.big{flex:1}

/* slot controls */
.slot:has(> .icobtns){grid-template-columns:auto 1fr auto}
.ctrl{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.ctrl button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:3px 10px;font-size:12.5px;font-weight:700;color:var(--muted)}
.ctrl button.on{background:var(--yolk-soft);border-color:var(--yolk);color:var(--yolk)}
.ctrl button.target{background:var(--tomato);border-color:var(--tomato);color:#fff}
.slot.sel{background:var(--yolk-soft);border-radius:12px;margin-inline:-8px;padding-inline:8px}
.tag.sp{background:var(--yolk-soft);color:var(--yolk)}
/* mode switch */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 4px;font-size:13.5px;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--tomato);color:#fff}
.wheelwrap.small{width:min(62vw,230px)}
/* session */
.sess-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.slot{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:0}
.role{font-size:11.5px;font-weight:700;border-radius:8px;padding:2px 7px;white-space:nowrap;align-self:start;margin-top:3px}
.role.special{background:var(--tomato-soft);color:var(--tomato)}
.role.main{background:var(--yolk-soft);color:var(--yolk)}
.role.side{background:var(--sky-soft);color:var(--sky)}
.role.veg{background:var(--leaf-soft);color:var(--leaf)}
.role.soup{background:var(--sky-soft);color:var(--sky)}
.role.staple{background:var(--soy-soft,var(--line));color:var(--ink)}
.role.fancy{background:var(--tomato);color:#fff}
.role.bf{background:var(--line);color:var(--muted)}
.slot .mid{min-width:0;display:flex;flex-direction:column;gap:3px}
.dname{border:0;background:none;padding:0;text-align:left;font-size:16.5px;font-weight:700;line-height:1.35}
.dname.hide{color:var(--muted);letter-spacing:.3em}
.dname.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.85);opacity:.3}60%{transform:scale(1.06)}100%{transform:none;opacity:1}}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.icobtns{display:flex;flex-direction:column;gap:6px}
.ico{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center}
.ico.on{background:var(--yolk-soft);border-color:var(--yolk);color:var(--yolk)}
.plates{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:4px;margin-top:4px}
.plates .lbl{font-weight:700;color:var(--muted);font-size:12px}
details.flow{margin-top:8px;font-size:13.5px}
details.flow summary{cursor:pointer;font-weight:700;color:var(--leaf);list-style:none}
details.flow summary::-webkit-details-marker{display:none}
details.flow summary::before{content:"▸ ";}
details.flow[open] summary::before{content:"▾ ";}
details.flow ol.tl{list-style:none;padding-left:0}
details.flow ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* stage badge + pips */
.badge{font-size:11.5px;font-weight:700;border-radius:999px;padding:0 8px;line-height:20px;white-space:nowrap}
.st0{background:var(--line);color:var(--muted)}
.st1{background:var(--sky-soft);color:var(--sky)}
.st2{background:var(--leaf-soft);color:var(--leaf)}
.st3{background:var(--yolk-soft);color:var(--yolk)}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);display:block}
.pips i.f{background:var(--leaf);border-color:var(--leaf)}
.pips.gold i.f{background:var(--yolk-bright);border-color:var(--yolk-bright)}
.pips.lg i{width:14px;height:14px}
.tag{font-size:11.5px;border-radius:999px;padding:0 7px;line-height:19px;white-space:nowrap}
.tag.mem{background:var(--tomato-soft);color:var(--tomato)}
.tag.buy{border:1px dashed var(--tomato);color:var(--tomato)}
.tag.new{border:1px solid var(--line);color:var(--muted)}

/* skills */
.hero{display:flex;flex-direction:column;gap:10px;background:linear-gradient(135deg,var(--yolk-soft),var(--leaf-soft));border:0}
.hero .title{font-size:26px;font-weight:900}
.bar{height:10px;border-radius:5px;background:var(--surface);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:5px}
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.counts div{background:var(--surface);border-radius:12px;padding:6px 2px;font-size:12px;color:var(--muted)}
.counts b{display:block;font-size:20px;color:var(--ink)}
.ladder{display:flex;gap:6px;font-size:12px;flex-wrap:wrap;color:var(--muted)}
.ladder span{display:flex;align-items:center;gap:4px}
.sec-h{display:flex;align-items:center;gap:8px;margin-top:6px}
.skill{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.skill:first-of-type{border-top:0}
.skill .mid{min-width:0;display:flex;flex-direction:column;gap:4px}
.skill .next{font-size:12.5px;color:var(--muted)}
.plus{display:flex;gap:6px;align-items:center}
.plus .add{width:44px;height:44px;border-radius:14px;border:0;background:var(--leaf);color:#fff;font-size:22px;font-weight:900;font-family:var(--f-num)}
.plus .sub{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13.5px}
.update.due{background:var(--yolk-soft);border-color:var(--yolk)}

/* shop */
.trip-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.group h3{font-size:12.5px;color:var(--muted);letter-spacing:.1em;margin-top:12px}
.item{display:grid;grid-template-columns:26px 1fr auto;gap:0 8px;align-items:start;padding-block:9px;border-top:1px solid var(--line)}
.item input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--leaf)}
.item .nm{font-weight:500}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.item .note{grid-column:2/-1;font-size:12px;color:var(--muted)}
.price{display:flex;align-items:center;gap:1px;font-family:var(--f-num);font-weight:800}
.price input{width:58px;text-align:right;border:1px solid transparent;background:transparent;border-radius:6px;padding:1px 4px;font:inherit;color:var(--ink)}
.price input:focus,.price input:hover{border-color:var(--line);background:var(--bg)}
.qty{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--ink);font-size:13px}
.report{display:flex;flex-direction:column;gap:12px;background:var(--bg);border-radius:16px;padding:14px}
.report.month{background:var(--yolk-soft)}
.report h3{font-size:13px;color:var(--muted);margin-bottom:4px}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center}
.stat3 div{background:var(--surface);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column}
.stat3 b{font-size:19px}
.stat3 span{font-size:12px;color:var(--muted)}
.uprow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-block:4px;font-size:14px}
.bars{display:flex;gap:10px;align-items:flex-end;min-height:120px;padding-top:6px}
.barcol{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0}
.barcol i{display:block;width:100%;max-width:40px;border-radius:6px 6px 0 0}
.tag.ok{background:var(--leaf-soft);color:var(--leaf)}
.tag.warn{background:var(--tomato-soft);color:var(--tomato)}
.tag.skip{border:1px solid var(--line);color:var(--muted);text-decoration:line-through}
.item.gone .nm{color:var(--muted);text-decoration:line-through}
.banner{background:var(--tomato-soft);border-color:var(--tomato)}
.banner .row{font-size:14px}
.sugg{display:flex;flex-direction:column;gap:4px;padding-block:10px;border-top:1px solid var(--line)}
.sugg:first-of-type{border-top:0}
.ctrl button.target{background:var(--tomato);border-color:var(--tomato);color:#fff}
.note-row{padding-block:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.note-row:first-of-type{border-top:0}
.tag.tg{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.askmini{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;width:22px;height:22px;font-size:12px;font-weight:700;padding:0;vertical-align:middle}
.total{display:flex;justify-content:space-between;font-weight:900;font-size:16px;padding-top:12px;border-top:2px solid var(--line);margin-top:8px}

/* settings */
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-block:4px}
.row input[type=number]{width:96px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:var(--f-num);font-weight:800;font-size:15px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{border:0;background:none;border-radius:12px;padding:6px 2px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--tomato);background:var(--tomato-soft)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgb(0 0 0 / .42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.sheet ul.ing{margin:0;padding-left:18px;columns:2;column-gap:16px}
.challenge{background:var(--yolk-soft);border-radius:14px;padding:12px 14px}
.challenge .k{font-size:12px;font-weight:700;color:var(--yolk)}
.vars{display:flex;flex-direction:column;gap:6px;font-size:14px}
.vars div{display:flex;gap:8px;align-items:flex-start}
.vars .lock{color:var(--muted)}
.tip{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px}
.sticky-cta{position:sticky;bottom:0;padding-top:8px;background:linear-gradient(to bottom,transparent,var(--surface) 30%)}

/* celebrate */
.celebrate{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgb(0 0 0 / .5);padding:16px}
.celebrate .box{background:var(--surface);border-radius:24px;padding:26px 22px;text-align:center;max-width:360px;width:100%;display:flex;flex-direction:column;gap:10px;animation:pop .5s ease;position:relative;overflow:hidden}
.celebrate .up{font-size:30px;font-weight:900;color:var(--tomato)}
.celebrate .from{display:flex;justify-content:center;align-items:center;gap:8px;font-size:15px}
.celebrate canvas{position:absolute;inset:0;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
.foot{font-size:12.5px;color:var(--muted);text-align:center;margin-top:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px)} body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><div class="brand">開伙轉盤</div><h1 id="greet">這週想吃什麼？</h1><div class="small muted" id="todayLine"></div></div>
    <div style="display:flex;gap:6px;align-items:center"><button class="pill" id="budgetPill" data-tab="shop">NT$ —</button><button class="pill" id="btnHelp" aria-label="使用說明" style="background:var(--surface);color:var(--muted);border:1px solid var(--line)">?</button></div>
  </header>
  <button class="hint" id="dueHint" data-tab="skill" hidden>兩週了，可以去「熟練度」加入新菜</button>

  <main id="tab-spin" class="stack"></main>
  <main id="tab-shop" class="stack" hidden></main>
  <main id="tab-fridge" class="stack" hidden></main>
  <main id="tab-skill" class="stack" hidden></main>
  <main id="tab-set" class="stack" hidden></main>
  <p class="foot" id="sync"></p>
</div>

<nav class="tabs" aria-label="分頁"><div class="in" role="tablist">
  <button role="tab" data-tab="spin" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.4M12 12 5.6 18.4M12 12H3"/></svg>抽菜</button>
  <button role="tab" data-tab="shop" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16l-1.5 11a2 2 0 0 1-2 1.7h-9a2 2 0 0 1-2-1.7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>採買</button>
  <button role="tab" data-tab="fridge" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 10h14M9 6v2M9 13v3"/></svg>冰箱</button>
  <button role="tab" data-tab="skill" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>熟練度</button>
  <button role="tab" data-tab="set" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>設定</button>
</div></nav>
<div id="sheetRoot"></div>
<div id="celebrateRoot"></div>
<div id="toastRoot"></div>

<script>
//#core-start

 {id:'basil_egg',n:'九層塔炒蛋',roles:['side'],lv:1,mem:1,sv:2,use:{egg:.3,basil:1},sea:['salt','oil'],cook:'pan',min:10,
  reheat:'微波 1 分鐘，當天吃最香。',
  steps:['九層塔摘葉切碎，和 3 顆蛋、一撮鹽一起打勻。','鍋熱 2 大匙油，倒入蛋液，邊緣凝固後大塊翻面。','兩面金黃就起鍋。'],
  tip:'油要夠熱，蛋才會蓬。'},
 {id:'carrot_egg',n:'紅蘿蔔炒蛋',roles:['side'],lv:1,mem:0,sv:2,use:{carrot:1,egg:.3,garlic:.1},sea:['salt','oil'],cook:'pan',min:15,
  reheat:'微波 1 分鐘，放 3 天沒問題。',
  steps:['紅蘿蔔刨絲（或切細絲），蛋打散。','鍋熱油，先炒蛋到半熟盛起。','炒蒜末和紅蘿蔔絲到變軟，大約 3 分鐘。','蛋回鍋，加鹽拌勻。'],
  tip:'紅蘿蔔用油炒，營養比較好吸收。很便宜又耐放的配菜。'},
 {id:'cabbage_garlic',n:'蒜炒高麗菜',roles:['side'],lv:1,mem:1,sv:3,use:{cabbage:.5,garlic:.15,carrot:.3},sea:['oil','salt'],cook:'pan',min:15,
  reheat:'微波 1 分半，高麗菜放 3 天還可以。',
  steps:['高麗菜用手撕成片，洗好瀝乾；蒜切片，紅蘿蔔切片。','鍋熱油，蒜片炒香。','高麗菜和紅蘿蔔下鍋大火翻炒，沿鍋邊加 2 大匙水，蓋鍋 1 分鐘。','開蓋加鹽炒勻。'],
  tip:'手撕的高麗菜比刀切的更好吃，斷面比較能吸味道。'},
 {id:'cabbage_shrimp',n:'蝦醬炒高麗菜',roles:['side'],lv:2,mem:1,sv:3,use:{cabbage:.5,garlic:.15,chili:.2},sea:['shrimp_paste','oil'],cook:'pan',min:15,
  reheat:'微波 1 分半。',
  steps:['高麗菜撕片，蒜、辣椒切片。','鍋熱油，蒜和辣椒炒香，加蝦醬 1 大匙小火炒 30 秒。','高麗菜下鍋大火翻炒，加 2 大匙水蓋鍋 1 分鐘。','開蓋炒勻，蝦醬已經有鹹味，先試再決定要不要加鹽。'],
  tip:'蒜炒高麗菜熟了以後的進階版。'},
 {id:'napa_stew',n:'白菜滷',roles:['side'],lv:2,mem:0,sv:3,use:{napa:1,carrot:.3,egg:.2,enoki:1,garlic:.1},sea:['soy','pepper','oil'],cook:'pot',min:30,
  reheat:'快煮鍋或微波，越放越甜。',
  steps:['蛋打散，鍋熱油煎成蛋皮，切小塊（台式白菜滷的「蛋酥」簡化版）。','蒜、紅蘿蔔絲先炒香。','大白菜切大塊下鍋，炒軟後移到快煮鍋。','加金針菇、蛋塊、醬油 1 大匙、水約 200ml，小火煮 15 分鐘，撒胡椒粉。'],
  tip:'大白菜自己會出很多水，水不用加太多。'},
 {id:'radish_rib',soup:1,n:'蘿蔔排骨湯',roles:['side'],lv:1,mem:1,sv:4,use:{ribs:1,radish:.5,ginger:.2},sea:['salt'],cook:'pot',min:50,
  reheat:'快煮鍋重新煮滾。',
  steps:['排骨冷水下快煮鍋，水滾後煮 2 分鐘，倒掉水、沖掉浮沫。','重新加水約 1.2 公升，放薑片，煮滾後轉小火 20 分鐘。','白蘿蔔去皮切塊放進去，再煮 20 分鐘到蘿蔔透明。','最後才加鹽。'],
  tip:'排骨先汆燙，湯才會清。鹽最後放，肉比較不會老。'},
 {id:'corn_rib',soup:1,n:'玉米排骨湯',roles:['side'],lv:1,mem:1,sv:4,use:{ribs:1,corn:1,carrot:.5},sea:['salt'],cook:'pot',min:50,
  reheat:'快煮鍋重新煮滾。',
  steps:['排骨汆燙：冷水下鍋，滾 2 分鐘後倒掉水沖乾淨。','加水約 1.2 公升，放玉米段和紅蘿蔔塊。','煮滾後小火 30–40 分鐘。','加鹽調味。'],
  tip:'和蘿蔔排骨湯是同一套做法，換食材就是新的湯。'},
 {id:'borscht',soup:1,n:'羅宋湯',roles:['side'],lv:2,mem:1,sv:4,use:{pork_block:.5,tomato:.67,onion:.67,cabbage:.3,carrot:.5,potato:.67,tomato_paste:1},sea:['sugar','salt','oil'],cook:'pot',min:60,
  reheat:'快煮鍋重新煮滾，放兩三天更濃。',
  steps:['所有蔬菜和肉切小塊。','快煮鍋少許油，洋蔥炒軟，再放肉炒到變色。','加番茄、番茄糊，炒到番茄出汁。','放紅蘿蔔、馬鈴薯、高麗菜，加水約 1.2 公升。','煮滾後小火 40 分鐘，用鹽和糖 1 小匙調味。'],
  tip:'番茄糊要先炒過，酸味會變溫和、顏色更紅。'},
 {id:'tofu_soup',soup:1,n:'番茄豆腐蛋花湯',roles:['side'],lv:1,mem:0,sv:3,use:{tomato:.67,tofu:1,egg:.2,scallion:.2},sea:['salt','sesame_oil','pepper'],cook:'pot',min:15,
  reheat:'快煮鍋重新煮滾。',
  steps:['番茄切塊，豆腐切小塊。','快煮鍋加水約 800ml，放番茄煮 5 分鐘到出味。','放豆腐再煮 3 分鐘，加鹽。','關到小火，蛋液繞圈慢慢倒進去，等 10 秒再攪。','滴麻油、撒胡椒粉和蔥花。'],
  tip:'只用你現有的調味料就能做。蛋液要等湯小滾再倒，蛋花才會漂亮。'},
 {id:'qingjiang',n:'炒青江菜',roles:['veg'],lv:1,mem:1,sv:4,use:{qingjiang:1,garlic:.15},sea:['oil','salt'],cook:'fresh',min:5,
  reheat:'葉菜不耐放，每天現炒或現燙一份。',
  steps:['青江菜一片片剝開洗乾淨，大的對切。','鍋熱油，蒜末炒香。','青江菜下鍋大火翻炒，加 1 大匙水。','菜梗變軟就加鹽起鍋。'],
  tip:'梗比葉子難熟，可以梗先下、葉子後下。'},
 {id:'douru_kongxin',n:'豆乳空心菜',roles:['veg'],lv:2,mem:1,sv:4,use:{kongxin:1,garlic:.15,chili:.2},sea:['furu','oil','sugar'],cook:'fresh',min:5,
  reheat:'每天現炒一份。',
  steps:['空心菜切段，梗和葉分開。豆腐乳 1 塊加一點醬汁和糖 1/2 小匙壓成泥。','鍋熱油，蒜和辣椒炒香，加豆腐乳醬炒 10 秒。','先下梗炒 30 秒，再下葉大火炒軟。'],
  tip:'豆腐乳很鹹，不用再加鹽。'},
 {id:'garlic_spinach',n:'蒜炒菠菜',roles:['veg'],lv:1,mem:1,sv:4,use:{spinach:1,garlic:.15},sea:['oil','salt'],cook:'fresh',min:5,
  reheat:'每天現炒一份。',
  steps:['菠菜切段洗乾淨，根部的泥要洗掉（根很甜，可以留著）。','鍋熱油，蒜片炒香。','菠菜大火炒 1 分鐘到軟，加鹽。'],
  tip:'菠菜出水快，火要大、動作要快。'},
 {id:'longxu',n:'涼拌龍鬚菜',roles:['veg'],lv:1,mem:1,sv:4,use:{longxu:1,garlic:.15},sea:['soy','vinegar','sesame_oil'],cook:'fresh',min:10,
  reheat:'冰箱可放 2 天，直接冷吃。',
  steps:['龍鬚菜摘掉老的部分，切段。','快煮鍋水滾，燙 1 分鐘撈起，泡冷水後擠乾。','醬油 1 大匙、醋 1 小匙、麻油 1 小匙、蒜末拌勻。'],
  tip:'全部用你現有的調味料，第一週就能做。'},
 {id:'blanch',n:'燙青菜',roles:['veg'],lv:1,mem:0,sv:4,use:{leafy:1},sea:['soy','sesame_oil'],cook:'fresh',min:5,
  reheat:'每天晚上燙一份就好，快煮鍋 2 分鐘。',
  steps:['青菜洗好切段。','快煮鍋水滾，加一點鹽和幾滴油（菜會比較綠）。','燙 1–2 分鐘撈起。','淋醬油 1 小匙、麻油幾滴。'],
  tip:'備餐的日子最省事的青菜，一包可以吃四餐。'},
 {id:'hongshao_fish',n:'紅燒魚',roles:['special'],lv:3,mem:1,sv:1,use:{fish:1,scallion:.3,ginger:.3,garlic:.1},sea:['soy','sugar','rice_wine','oil'],cook:'fresh',min:30,
  reheat:'當天吃最好。',
  steps:['魚用紙巾擦乾，兩面各劃 2–3 刀。','鍋要燒很熱再放 2 大匙油，魚下鍋後 3 分鐘不要動，搖鍋魚能滑動再翻面。','兩面都煎好後，旁邊放薑、蒜、蔥白爆香。','醬油 2、米酒 2、糖 1 大匙，加水半碗，煮滾後蓋鍋中小火 8 分鐘，中間舀醬汁淋魚。','開蓋收汁，放蔥綠。'],
  tip:'魚皮會黏鍋，幾乎都是因為鍋不夠熱或太早翻。'},
 {id:'shrimp_pasta',n:'蒜炒鮮蝦義大利麵',roles:['fancy'],lv:2,mem:1,sv:1,use:{pasta:.2,shrimp:.5,garlic:.3,chili:.3},sea:['oil','salt','pepper'],cook:'fresh',min:25,
  reheat:'當天吃最好。',
  steps:['蝦子退冰，剝殼、背部劃一刀去腸泥。蒜切片、辣椒切圈。','快煮鍋水滾加一大匙鹽，煮麵（照包裝時間減 1 分鐘），留半碗煮麵水。','平底鍋多一點油，小火慢煎蒜片到微金黃，放辣椒。','放蝦子中火煎到兩面變紅。','麵和半碗煮麵水下鍋，大火拌炒到醬汁包住麵，鹽和胡椒調味。'],
  tip:'煮麵水裡的澱粉會讓油和水融合，麵才不會乾。'},
 {id:'tomato_pasta',n:'爆量起司番茄義大利麵',roles:['fancy'],lv:2,mem:1,sv:1,use:{pasta:.2,tomato:.67,onion:.33,bacon:.5,cheese:.25,tomato_paste:.5},sea:['sugar','salt','oil'],cook:'fresh',min:30,
  reheat:'醬可以先做好冷藏，麵當天煮。',
  steps:['培根切小片，洋蔥切丁，番茄切丁。','快煮鍋煮麵（加鹽），留半碗煮麵水。','平底鍋煎培根到出油，放洋蔥炒軟。','加番茄和番茄糊 2 大匙，中火炒到番茄軟爛成醬，糖 1/2 小匙平衡酸味。','麵和煮麵水下鍋拌勻，關火鋪 3 片起司片，蓋鍋 1 分鐘讓起司融化。'],
  tip:'你筆記裡的「番茄培根義大利麵」也是這道，加不加起司都可以。'},
 {id:'beef_hotpot',n:'牛肉火鍋',roles:['special'],lv:1,mem:1,sv:1,use:{beef_hotpot:1,napa:.5,enoki:1,tofu:1,balls:1},sea:['soy'],cook:'fresh',min:20,
  reheat:'現煮現吃。',
  steps:['大白菜切大塊，豆腐切塊，金針菇撥開。','快煮鍋放大白菜和水，煮滾 5 分鐘出甜味當湯底。','放豆腐、火鍋料煮 3 分鐘。','金針菇、牛肉片最後放，肉片變色就能吃。','沾醬：醬油加蒜末、蔥花，有醋可以加一點。'],
  tip:'你筆記寫「別鬧了，吃牛肉火鍋」，這次自己煮。白菜先煮就是最簡單的湯底。'},
 {id:'sukiyaki',n:'壽喜燒',roles:['special'],lv:2,mem:0,sv:1,use:{beef_hotpot:1,onion:.33,napa:.3,tofu:.5,enoki:.5,egg:.1},sea:['soy','sugar','rice_wine'],cook:'fresh',min:20,
  reheat:'現煮現吃。',
  steps:['醬汁：醬油 3、米酒 3、糖 2 大匙、水 100ml。','平底鍋少許油，洋蔥炒軟。','倒醬汁，排進白菜、豆腐、金針菇，煮 5 分鐘。','牛肉片放上去燙熟。','蛋打散當沾醬（怕生蛋就直接打在鍋裡煮）。'],
  tip:'和牛肉火鍋用一樣的食材，換個醬汁就是另一道。'},
 {id:'scallion_noodle',n:'蔥油拌麵',roles:['fancy'],lv:1,mem:0,sv:1,use:{noodle:.25,scallion:.5,egg:.1},sea:['oil','soy','sugar'],cook:'fresh',min:20,
  reheat:'蔥油可以一次做多一點，冰起來下次用。',
  steps:['蔥切段，蔥白蔥綠分開。','平底鍋放 4 大匙油、蔥白，小火慢慢炸 5 分鐘，再放蔥綠炸到變深色。','關火，加醬油 2 大匙、糖 1 小匙，攪勻就是蔥油醬。','快煮鍋煮麵、順便煎一顆荷包蛋。','麵拌 2 大匙蔥油醬，放上蛋。'],
  tip:'全程小火，蔥慢慢變焦香但不能變黑。'},
 {id:'sesame_noodle',n:'麻醬麵',roles:['fancy'],lv:1,mem:0,sv:1,use:{noodle:.25,egg:.1,carrot:.2},sea:['sesame_paste','soy','vinegar','sugar','sesame_oil'],cook:'fresh',min:15,
  reheat:'冷熱都好吃。',
  steps:['芝麻醬 2 大匙、醬油 1、醋 1 小匙、糖 1/2 小匙、麻油幾滴，加 2 大匙溫水慢慢攪開。','紅蘿蔔刨絲，蛋煎成蛋皮切絲。','快煮鍋煮麵，撈起。','淋醬、放上紅蘿蔔絲和蛋絲拌勻。'],
  tip:'芝麻醬要一點一點加水攪，才會滑順不結塊。'},
 {id:'shrimp_egg',n:'滑蛋蝦仁',roles:['special'],lv:1,mem:0,sv:1,use:{shrimp_peeled:.5,egg:.3,scallion:.2},sea:['salt','oil'],cook:'fresh',min:15,
  reheat:'當天吃最好。',
  steps:['蝦仁退冰擦乾，3 顆蛋加一撮鹽和 1 大匙水打勻。','鍋熱油，蝦仁煎到變紅捲起，先盛起。','轉小火加一點油，倒蛋液，用鏟子從邊緣往中間推。','蛋還有一點流動時放回蝦仁，撒蔥花，馬上關火。'],
  tip:'「滑」的關鍵是小火、蛋還沒全熟就關火，餘溫會讓它剛好。'},
 {id:'pepper_shrimp',n:'胡椒蝦',roles:['special'],lv:2,mem:0,sv:1,use:{shrimp:.67,garlic:.3},sea:['butter','black_pepper','salt','rice_wine'],cook:'fresh',min:20,
  reheat:'當天吃最好。',
  steps:['蝦子退冰，剪掉鬚腳、背部剪開去腸泥，擦乾。','平底鍋放 1 大匙奶油和一點油，蝦子平鋪兩面煎紅。','放蒜末炒香。','米酒 1 大匙嗆一下，撒大量黑胡椒和一點鹽，大火翻炒到乾香。'],
  tip:'蝦要擦乾再下鍋，殼才會酥香。'},
 // 早餐（你筆記裡的吐司系列，沒有烤箱就用平底鍋）
 {id:'egg_toast',n:'奶蛋吐司',roles:['bf'],lv:1,mem:1,sv:1,use:{toast:.25,egg:.1,milk:.1},sea:['butter','sugar'],cook:'pan',min:10,
  steps:['蛋 1 顆加牛奶 3 大匙、糖少許打勻。','吐司兩面沾蛋奶液。','平底鍋小火融一點奶油，吐司兩面各煎 2 分鐘到金黃。'],tip:'平底鍋版本，不需要烤箱。'},
 {id:'french_toast',n:'法式吐司',roles:['bf'],lv:1,mem:1,sv:1,use:{toast:.25,egg:.1,milk:.15},sea:['butter','sugar'],cook:'pan',min:15,
  steps:['蛋 1 顆、牛奶 100ml、糖 1 小匙打勻。','吐司泡 1 分鐘讓它吸飽。','奶油小火慢煎，蓋鍋讓中間熟透，兩面金黃。'],tip:'和奶蛋吐司的差別是吐司泡得更久、口感像布丁。'},
 {id:'bacon_toast',n:'培根蛋吐司',roles:['bf'],lv:1,mem:1,sv:1,use:{toast:.25,egg:.1,bacon:.25},sea:['mayo','pepper'],cook:'pan',min:10,
  steps:['平底鍋煎培根到微脆。','用培根的油煎一顆荷包蛋。','吐司抹美乃滋，夾培根和蛋，撒胡椒。'],tip:'不用另外放油，培根自己會出油。'},
 {id:'corn_toast',n:'起司玉米鮪魚吐司',roles:['bf'],lv:1,mem:1,sv:1,use:{toast:.25,corn_can:.25,tuna:.25,cheese:.08},sea:['mayo'],cook:'pan',min:10,
  steps:['鮪魚瀝油，加玉米粒和美乃滋拌勻。','吐司鋪上餡料和起司片。','平底鍋小火、蓋鍋 3 分鐘讓起司融化。'],tip:'鮪魚玉米餡可以一次拌好冰著，吃 2–3 天。'},
 {id:'rouzao',n:'電鍋肉燥',roles:['main'],lv:1,mem:0,sv:4,use:{mince:1,scallion:.3,garlic:.2,egg:.3},sea:['soy','sugar','rice_wine','pepper','oil'],cook:'pot',min:50,
  reheat:'電鍋或微波，淋在飯上就是肉燥飯。',
  steps:['蔥白切末、蒜切末。蛋冷水下鍋煮 8 分鐘，剝殼。','平底鍋少許油，蔥白和蒜末炒香，下絞肉炒到變白、鬆散。','加醬油 4、米酒 2、糖 1 大匙、胡椒粉，炒勻。','倒進電鍋內鍋，放水煮蛋，加水剛好蓋過。','外鍋 2 杯水，跳起來燜 15 分鐘。'],
  tip:'絞肉炒的時候用鏟子一直壓散，肉燥才會細。'},
 {id:'pepper_pork',n:'青椒炒肉絲',roles:['main'],lv:1,mem:0,sv:3,use:{pork_slice:1,bell_pepper:1,garlic:.1},sea:['soy','sugar','oil'],cook:'pan',min:15,
  reheat:'微波 1 分半。',
  steps:['肉片切絲，加醬油 1 大匙抓一下。青椒去籽切絲。','鍋熱油，肉絲大火炒到變色，先盛起。','原鍋炒蒜末和青椒 1 分鐘。','肉絲回鍋，醬油 1 大匙、糖 1/2 小匙，炒勻。'],
  tip:'肉先起鍋最後再回鍋，才不會炒老。'},
 {id:'kungpao',n:'宮保雞丁',roles:['main'],lv:2,mem:0,sv:3,use:{chicken_thigh:1,scallion:.5,garlic:.2,chili:.3},sea:['soy','sugar','vinegar','oil'],cook:'pan',min:25,
  reheat:'微波 1 分半，很下飯。',
  steps:['雞腿排切丁，加醬油 1 大匙抓勻。蔥切段，辣椒切段。','醬汁：醬油 2、醋 1、糖 1 大匙調好。','鍋熱油，雞丁煎到兩面金黃。','放蒜、辣椒、蔥白炒香。','倒醬汁大火炒到收汁，放蔥綠。有花生的話最後撒一把。'],
  tip:'醬汁先調好再開火，才不會手忙腳亂。'},
 {id:'mapo',n:'麻婆豆腐',roles:['main'],lv:2,mem:0,sv:3,use:{mince:.5,tofu:2,scallion:.3,garlic:.2},sea:['bean_paste','soy','oil'],cook:'pan',min:20,
  reheat:'微波 1 分半，隔天更入味。',
  steps:['豆腐切小方塊，蔥切花，蒜切末。','鍋熱油，絞肉炒到變白出油。','放蒜末和辣豆瓣醬 1 大匙，小火炒出紅油。','加水約 150ml、醬油 1 大匙，放豆腐，用推的不要用翻的，煮 5 分鐘。','撒蔥花。'],
  tip:'豆腐用推的才不會碎。'},
 {id:'salt_chicken',n:'蒜香鹽水雞',roles:['main'],lv:1,mem:0,sv:3,use:{chicken_breast:1,garlic:.2,scallion:.2,cucumber:.33},sea:['salt','pepper','sesame_oil'],cook:'pot',min:25,
  reheat:'冷吃就好，夏天很適合。',
  steps:['快煮鍋水滾，放雞胸肉和 1 小匙鹽，再滾後關火，蓋鍋燜 15 分鐘。','撈起放涼，用手撕成條。','小黃瓜拍裂切段。','加蒜末、蔥花、鹽、胡椒粉、麻油拌勻。'],
  tip:'關火燜熟的雞胸肉不會柴，這招可以用一輩子。'},
 {id:'oyakodon',n:'親子丼',roles:['special'],lv:2,mem:0,sv:1,use:{chicken_thigh:.5,onion:.33,egg:.2,scallion:.2},sea:['soy','sugar','rice_wine'],cook:'fresh',min:20,
  reheat:'現煮最好吃，蛋要半熟。',
  steps:['雞腿排切塊，洋蔥切絲。','平底鍋放醬油 2、米酒 2、糖 1 大匙、水 80ml，煮滾。','放洋蔥和雞肉，中火煮 6 分鐘到雞肉熟。','2 顆蛋稍微打散，分兩次繞圈倒進去，蓋鍋 30 秒就關火。','整鍋滑到白飯上，撒蔥花。'],
  tip:'蛋不要打太散，分兩次下，才有滑嫩和半熟兩種口感。'},
 {id:'clam_wine',n:'酒蒸蛤蠣',roles:['special'],lv:1,mem:0,sv:1,use:{clam:1,garlic:.2,basil:.5,chili:.2},sea:['rice_wine','salt','oil'],cook:'fresh',min:15,
  reheat:'現煮現吃。',
  steps:['冷凍蛤蠣不用退冰。蒜切片、辣椒切圈。','平底鍋少許油，蒜片和辣椒炒香。','放蛤蠣，倒米酒 3 大匙，蓋鍋中火 3–4 分鐘。','蛤蠣全開就放九層塔，試味道再決定要不要加鹽。'],
  tip:'湯汁很鮮，可以拌麵或拌飯。'},
 {id:'potsticker',n:'冰花煎餃',roles:['fancy'],lv:1,mem:0,sv:1,use:{dumplings:.4,scallion:.1},sea:['oil','soy','vinegar'],cook:'fresh',min:15,
  reheat:'現煎現吃。',
  steps:['平底鍋少許油，冷凍水餃不用退冰直接排好。','麵粉水：水 100ml 加 1 小匙太白粉或麵粉（沒有就只用水）。','倒進鍋裡，蓋鍋中火 8 分鐘。','開蓋讓水分收乾，底部變金黃脆皮。','醬油加醋當沾醬。'],
  tip:'最省事的一餐，冷凍庫放一包，懶得煮的時候救命。'},
 {id:'yaki_udon',n:'炒烏龍麵',roles:['fancy'],lv:1,mem:0,sv:1,use:{udon:.33,pork_slice:.3,cabbage:.2,carrot:.2},sea:['soy','sugar','oil'],cook:'fresh',min:15,
  reheat:'現炒現吃。',
  steps:['烏龍麵用熱水泡 1 分鐘撥散。高麗菜、紅蘿蔔切絲。','鍋熱油，肉片炒到變色。','放高麗菜和紅蘿蔔炒軟。','放烏龍麵，醬油 2 大匙、糖 1/2 小匙、水 2 大匙，大火拌炒到上色。'],
  tip:'加水是為了讓麵不黏鍋，又能均勻上色。'},
 {id:'clam_egg',n:'蛤蠣蒸蛋',roles:['side'],lv:1,mem:0,sv:2,use:{clam:.5,egg:.3,scallion:.1},sea:['salt','rice_wine'],cook:'pot',min:20,
  reheat:'電鍋再蒸 3 分鐘。',
  steps:['3 顆蛋加 1.5 倍蛋液量的水（約 230ml）、一撮鹽，打勻後用濾網過篩。','蛤蠣鋪在碗底，倒入蛋液。','碗口蓋一個盤子，放進電鍋，外鍋 1 杯水。','跳起來撒蔥花。'],
  tip:'蓋盤子是蒸蛋表面平滑的秘密。'},
 {id:'broccoli',n:'蒜炒綠花椰',roles:['side'],lv:1,mem:0,sv:3,use:{broccoli:1,garlic:.1,carrot:.2},sea:['oil','salt'],cook:'pan',min:15,
  reheat:'微波 1 分鐘，放 3 天還是脆的。',
  steps:['花椰菜切小朵，梗削皮切片。紅蘿蔔切片。','快煮鍋水滾，花椰菜和紅蘿蔔燙 1 分鐘撈起。','鍋熱油，蒜片炒香，放花椰菜大火炒 1 分鐘，加鹽。'],
  tip:'先燙再炒，顏色才會綠、熟度一致。'},
 {id:'fungus_egg',n:'木耳炒蛋',roles:['side'],lv:1,mem:0,sv:2,use:{fungus:1,egg:.3,garlic:.1,scallion:.2},sea:['salt','oil','soy'],cook:'pan',min:15,
  reheat:'微波 1 分鐘。',
  steps:['木耳切絲，蛋打散。','鍋熱油，蛋炒到半熟盛起。','炒蒜末和木耳 2 分鐘，加一點水。','蛋回鍋，鹽和一點醬油調味，撒蔥。'],
  tip:'木耳很便宜又耐放，口感脆脆的。'},
 {id:'seaweed_soup',soup:1,n:'紫菜蛋花湯',roles:['side'],lv:1,mem:0,sv:3,use:{seaweed:.3,egg:.2,scallion:.2},sea:['salt','sesame_oil','pepper'],cook:'pot',min:10,
  reheat:'快煮鍋重新煮滾。',
  steps:['快煮鍋加水約 800ml 煮滾。','紫菜撕小片放進去，加鹽。','關小火，蛋液繞圈倒進去，等 10 秒再攪。','滴麻油、撒胡椒粉和蔥花。'],
  tip:'10 分鐘的湯，只用你現有的調味料。'},
 {id:'bean_sprout',n:'韭菜豆芽',roles:['veg'],lv:1,mem:0,sv:3,use:{bean_sprout:1,scallion:.3},sea:['oil','salt'],cook:'fresh',min:5,
  reheat:'每天現炒一份。',
  steps:['豆芽洗好瀝乾，蔥切段（有韭菜可以換韭菜）。','鍋燒很熱再放油，豆芽大火炒 1 分鐘。','放蔥段，加鹽，馬上起鍋。'],
  tip:'豆芽要大火快炒才會脆，炒太久會出水。'},
 {id:'kailan',n:'蠔油芥藍',roles:['veg'],lv:1,mem:0,sv:3,use:{kailan:1,garlic:.1},sea:['oyster','oil'],cook:'fresh',min:8,
  reheat:'每天現做一份。',steps:['芥藍切段，梗比較粗的剖半。','快煮鍋水滾加幾滴油，燙 1 分半撈起。','淋蠔油 1 大匙，蒜末用熱油淋一下更香。'],tip:'燙青菜加幾滴油，顏色會更綠。'},
 {id:'sweet_potato_leaf',n:'蒜炒地瓜葉',roles:['veg'],lv:1,mem:0,sv:3,use:{leafy:1,garlic:.15},sea:['oil','salt'],cook:'fresh',min:5,
  reheat:'每天現炒一份。',steps:['地瓜葉摘嫩葉和嫩梗，洗乾淨。','鍋熱油，蒜片炒香。','地瓜葉大火炒 1 分鐘到軟，加鹽。'],tip:'地瓜葉很快熟，炒到一變軟就起鍋。'},
 {id:'chuanqi',n:'薑絲炒川七',roles:['veg'],lv:1,mem:0,sv:3,use:{chuanqi:1,ginger:.2},sea:['sesame_oil','salt'],cook:'fresh',min:5,
  reheat:'每天現炒一份。',steps:['老薑切細絲。','鍋裡放麻油，小火把薑絲煸香。','川七下鍋大火炒 1 分鐘，加鹽。'],tip:'麻油加薑絲是台式炒菜的經典組合，你本來就有麻油。'},
 {id:'amaranth',n:'蒜炒莧菜',roles:['veg'],lv:1,mem:0,sv:3,use:{amaranth:1,garlic:.15},sea:['oil','salt'],cook:'fresh',min:5,
  reheat:'每天現炒一份。',steps:['莧菜切段洗乾淨。','鍋熱油，蒜末炒香。','莧菜下鍋，加 2 大匙水，炒到軟加鹽。'],tip:'莧菜會出紅紫色的湯汁，是正常的。'},
 {id:'okra',n:'涼拌秋葵',roles:['veg'],lv:1,mem:0,sv:3,use:{okra:1,garlic:.1},sea:['soy','sesame_oil'],cook:'fresh',min:8,
  reheat:'冷吃，冰箱放 2 天沒問題。',steps:['秋葵切掉蒂頭。','快煮鍋水滾，燙 2 分鐘撈起泡冷水，斜切段。','醬油 1 大匙、麻油幾滴、蒜末拌勻。'],tip:'整根燙完再切，黏液才不會流光。'},
 {id:'lettuce',n:'蠔油大陸妹',roles:['veg'],lv:1,mem:0,sv:3,use:{lettuce:1,garlic:.1},sea:['oyster','oil'],cook:'fresh',min:5,
  reheat:'每天現做一份。',steps:['大陸妹撕大片洗好。','鍋熱油，蒜末炒香。','大火炒 30 秒，淋蠔油 1 大匙拌勻馬上起鍋。'],tip:'生菜炒很快，30 秒就好。'},
 {id:'snap_pea',n:'清炒甜豆',roles:['veg'],lv:1,mem:0,sv:3,use:{snap_pea:1,carrot:.2,garlic:.1},sea:['oil','salt'],cook:'fresh',min:8,
  reheat:'隔天微波還是脆的。',steps:['甜豆撕掉兩邊的筋，紅蘿蔔切片。','鍋熱油，蒜片炒香。','放甜豆和紅蘿蔔，加 2 大匙水，炒 2 分鐘加鹽。'],tip:'甜豆的筋一定要撕，不然會咬不斷。'},
 {id:'zucchini',n:'蒜炒櫛瓜',roles:['veg'],lv:1,mem:0,sv:3,use:{zucchini:1,garlic:.1},sea:['oil','salt','pepper'],cook:'fresh',min:8,
  reheat:'每天現做一份。',steps:['櫛瓜切半圓片。','平底鍋熱油，櫛瓜平鋪煎到兩面微焦。','放蒜末，加鹽和胡椒粉。'],tip:'先煎不翻，櫛瓜才會甜不出水。'},
 {id:'kongxin_garlic',n:'蒜炒空心菜',roles:['veg'],lv:1,mem:0,sv:3,use:{kongxin:1,garlic:.15,chili:.1},sea:['oil','salt'],cook:'fresh',min:5,
  reheat:'每天現炒一份。',steps:['空心菜切段，梗和葉分開。','鍋熱油，蒜和辣椒炒香。','先炒梗 30 秒，再放葉子大火炒軟，加鹽。'],tip:'跟豆乳空心菜是同一個做法，先學這個。'},
 {id:'kaiyang_napa',n:'開陽白菜',roles:['side'],lv:1,mem:0,sv:3,use:{napa:1,dried_shrimp:.2,garlic:.1,carrot:.2},sea:['oil','salt'],cook:'pan',min:20,
  reheat:'微波或快煮鍋，越放越甜。',steps:['蝦米泡溫水 10 分鐘。白菜切大塊，紅蘿蔔切片。','鍋熱油，蒜和蝦米炒香。','放白菜和紅蘿蔔，蓋鍋燜 5 分鐘讓白菜出水。','加鹽調味。'],tip:'蝦米一點點就很鮮，是台菜的味道來源。'},
 {id:'mixed_veg_egg',n:'三色豆炒蛋',roles:['side'],lv:1,mem:0,sv:2,use:{mixed_veg:.5,egg:.3},sea:['oil','salt'],cook:'pan',min:10,
  reheat:'微波 1 分鐘。',steps:['蛋打散加一撮鹽。','鍋熱油，三色豆不用退冰，炒 2 分鐘。','倒蛋液，等邊緣凝固再翻炒成塊。'],tip:'冷凍三色豆是懶人救星，放冷凍庫隨時能用。'},
 {id:'century_tofu',n:'皮蛋豆腐',roles:['side'],lv:1,mem:0,sv:2,use:{tofu:1,century_egg:.5,scallion:.1},sea:['soy','sesame_oil'],cook:'cold',min:5,
  reheat:'冷吃，吃之前再淋醬。',steps:['豆腐倒掉水，放盤子上。','皮蛋剝殼切小塊，鋪在豆腐上。','淋醬油 1 大匙、麻油幾滴，撒蔥花。'],tip:'5 分鐘不用開火，全部用你有的調味料。'},
 {id:'fungus_salad',n:'涼拌木耳',roles:['side'],lv:1,mem:0,sv:3,use:{fungus:1,garlic:.15,chili:.2},sea:['soy','vinegar','sugar','sesame_oil'],cook:'cold',min:10,
  reheat:'冷吃，冰 3 天更入味。',steps:['木耳切絲，快煮鍋燙 1 分鐘，泡冷水。','擠乾水分。','蒜末、辣椒、醬油 1、醋 1、糖 1 小匙、麻油拌勻。'],tip:'酸酸的很開胃，備餐放冰箱很方便。'},
 {id:'butter_corn',n:'奶油玉米',roles:['side'],lv:1,mem:0,sv:2,use:{corn_can:1},sea:['butter','salt','pepper'],cook:'pan',min:5,
  reheat:'微波 1 分鐘。',steps:['玉米粒瀝乾。','平底鍋放 1 小塊奶油融化。','玉米粒炒 2 分鐘到微焦，加鹽和胡椒粉。'],tip:'玉米炒到有點焦香最好吃。'},
 {id:'pepper_king',n:'黑胡椒杏鮑菇',roles:['side'],lv:1,mem:0,sv:2,use:{king_oyster:1,garlic:.1},sea:['black_pepper','soy','oil'],cook:'pan',min:10,
  reheat:'微波 1 分鐘。',steps:['杏鮑菇切厚片，兩面劃格子。','平底鍋少許油，菇平鋪煎到兩面金黃，先不要翻。','放蒜末，醬油 1 小匙，撒大量黑胡椒。'],tip:'劃格子可以讓醬汁吃進去。'},
 {id:'potato_shred',n:'醋溜馬鈴薯絲',roles:['side'],lv:2,mem:0,sv:3,use:{potato:.67,chili:.2,garlic:.1},sea:['vinegar','salt','oil'],cook:'pan',min:15,
  reheat:'微波 1 分鐘，冷吃也可以。',steps:['馬鈴薯切細絲，泡水洗掉澱粉，瀝乾。','鍋熱油，蒜和辣椒炒香。','馬鈴薯絲大火炒 2 分鐘，沿鍋邊淋醋 1 大匙，加鹽。'],tip:'泡水和大火是脆口的關鍵，炒太久會變軟。'},
 {id:'tomato_veg_soup',soup:1,n:'番茄蔬菜湯',roles:['side'],lv:1,mem:0,sv:4,use:{tomato:.67,cabbage:.3,onion:.33,carrot:.5},sea:['salt','sugar','oil'],cook:'pot',min:35,
  reheat:'快煮鍋重新煮滾，越放越濃。',steps:['所有蔬菜切小塊。','快煮鍋少許油，洋蔥和番茄炒到出汁。','放高麗菜和紅蘿蔔，加水約 1 公升。','煮滾後小火 25 分鐘，加鹽和一點糖。'],tip:'羅宋湯的簡化版，不用肉也很好喝。'},
 {id:'shiitake_soup',soup:1,n:'香菇雞湯',roles:['side'],lv:1,mem:0,sv:4,use:{chicken_drum:.6,shiitake:1,ginger:.2},sea:['salt','rice_wine'],cook:'pot',min:50,
  reheat:'快煮鍋重新煮滾。',steps:['雞肉冷水下鍋汆燙，水滾後撈起沖乾淨。','快煮鍋加水約 1.2 公升，放雞肉、香菇、薑片。','煮滾後小火 40 分鐘。','加米酒 1 大匙和鹽。'],tip:'也可以整鍋放宿舍電鍋，外鍋 2 杯水。'},
 {id:'hot_sour_soup',soup:1,n:'酸辣湯',roles:['side'],lv:2,mem:0,sv:4,use:{tofu:1,fungus:.5,egg:.2,carrot:.3,scallion:.2},sea:['vinegar','pepper','soy','salt'],cook:'pot',min:20,
  reheat:'快煮鍋加熱，醋可以吃之前再補。',steps:['豆腐、木耳、紅蘿蔔切細絲。','快煮鍋加水約 1 公升，放所有料煮 5 分鐘。','醬油 1、鹽少許，有太白粉就勾一點薄芡。','蛋液繞圈倒進去。','關火後加醋 2 大匙、胡椒粉 1 小匙，撒蔥花。'],tip:'醋和胡椒一定要關火後才放，香氣才不會跑掉。'},
 {id:'corn_soup',soup:1,n:'玉米濃湯',roles:['side'],lv:1,mem:0,sv:3,use:{corn_can:1,milk:.3,egg:.2,onion:.2},sea:['butter','salt','pepper'],cook:'pot',min:20,
  reheat:'快煮鍋小火加熱，要一直攪。',steps:['洋蔥切小丁，用奶油炒軟。','加玉米粒和水約 500ml，煮 10 分鐘。','加鮮奶，小火煮到快滾。','蛋液慢慢倒進去，加鹽和胡椒。'],tip:'鮮奶不要大滾，會分離。'},
 {id:'krapow',n:'打拋豬',roles:['main'],lv:2,mem:0,sv:3,use:{mince:1,basil:1,chili:.4,garlic:.3},sea:['soy','sugar','oil'],cook:'pan',min:15,
  reheat:'微波 1 分半，配飯或配荷包蛋。',steps:['蒜和辣椒切末，九層塔摘葉。','鍋熱油，蒜和辣椒炒香。','絞肉大火炒到變白、出油。','醬油 2、糖 1 小匙，炒到收乾。','關火放九層塔拌勻。'],tip:'正宗要用魚露和打拋葉，用醬油和九層塔是台灣家常版。'},
 {id:'garlic_wing',n:'蒜香雞翅',roles:['main'],lv:1,mem:0,sv:3,use:{chicken_wing:1,garlic:.3},sea:['soy','sugar','rice_wine','oil'],cook:'pan',min:30,
  reheat:'電鍋或微波，冷的也好吃。',steps:['雞翅兩面劃刀，醬油 2、米酒 1、糖 1 小匙、蒜末醃 30 分鐘。','平底鍋少許油，雞翅平鋪中小火煎 6 分鐘。','翻面，倒剩下的醃汁，蓋鍋燜 8 分鐘。','開蓋收汁到亮亮的。'],tip:'雞翅油脂多，中小火慢煎皮才會脆。'},
 {id:'mackerel',n:'香煎鯖魚',roles:['main'],lv:1,mem:0,sv:2,use:{mackerel:1},sea:['oil'],cook:'pan',min:15,
  reheat:'電鍋或微波 1 分鐘。',steps:['鯖魚退冰，用紙巾擦乾。','平底鍋少許油，皮朝下中火煎 5 分鐘。','翻面再煎 3 分鐘。','薄鹽鯖魚已經有鹹味，不用再加鹽。'],tip:'最簡單的魚料理，學會控制魚皮不黏鍋。'},
 {id:'tomato_fish',n:'番茄燒鯛魚',roles:['main'],lv:1,mem:0,sv:2,use:{fish_fillet:1,tomato:.67,onion:.33},sea:['salt','sugar','oil'],cook:'pan',min:20,
  reheat:'電鍋或微波，番茄汁可以拌飯。',steps:['鯛魚片切大塊，番茄切塊，洋蔥切絲。','鍋熱油，洋蔥和番茄炒到出汁。','加水半碗，煮滾後放魚片，小火 6 分鐘。','鹽和一點糖調味。'],tip:'鯛魚片沒有刺，很適合怕挑刺的人。'},
 {id:'steam_fish',n:'清蒸鯛魚',roles:['main'],lv:1,mem:0,sv:2,use:{fish_fillet:1,ginger:.2,scallion:.3},sea:['soy','rice_wine','oil'],cook:'pot',min:20,
  reheat:'電鍋再蒸 3 分鐘。',steps:['魚片放盤子，鋪薑絲，淋米酒 1 大匙。','放進電鍋，外鍋半杯水。','跳起來後倒掉盤子裡的水，鋪蔥絲。','淋醬油 1 大匙，再淋 1 大匙燒熱的油。'],tip:'最後淋熱油，蔥香會整個出來。'},
 {id:'onion_beef',n:'洋蔥炒牛肉',roles:['main'],lv:1,mem:0,sv:2,use:{beef_hotpot:1,onion:.67},sea:['soy','sugar','oil'],cook:'pan',min:15,
  reheat:'微波 1 分鐘，就是牛丼的料。',steps:['洋蔥切絲。','鍋熱油，洋蔥炒到軟、微微變透明。','放牛肉片，醬油 2、糖 1 小匙、水 3 大匙。','牛肉一變色就關火。'],tip:'牛肉片很薄，煮太久會老。'},
 {id:'dougan_pork',n:'豆干炒肉絲',roles:['main'],lv:1,mem:0,sv:3,use:{pork_slice:.7,dougan:1,scallion:.3,chili:.2},sea:['soy','sugar','oil'],cook:'pan',min:15,
  reheat:'微波 1 分半，放 3 天沒問題。',steps:['肉片切絲，豆干切絲，蔥切段。','鍋熱油，肉絲炒到變色盛起。','豆干炒到微焦，放蔥白和辣椒。','肉絲回鍋，醬油 2、糖 1 小匙，放蔥綠。'],tip:'豆干要先炒到微焦才香。'},
 {id:'fried_tofu_pork',n:'油豆腐燒肉',roles:['main'],lv:1,mem:0,sv:4,use:{pork_block:.7,fried_tofu:1,scallion:.3,garlic:.2},sea:['soy','sugar','rice_wine'],cook:'pot',min:45,
  reheat:'電鍋加熱，隔天更入味。',steps:['肉切塊，平底鍋不放油煎到出油。','放蒜和蔥白，醬油 3、米酒 2、糖 1 大匙炒香。','倒進快煮鍋，放油豆腐，加水蓋過。','小火煮 30 分鐘。'],tip:'油豆腐會吸飽滷汁，比肉還好吃。'},
 {id:'oyster_chicken',n:'蠔油雞丁杏鮑菇',roles:['main'],lv:1,mem:0,sv:3,use:{chicken_thigh:1,king_oyster:1,garlic:.1},sea:['oyster','soy','oil'],cook:'pan',min:20,
  reheat:'微波 1 分半。',steps:['雞腿排和杏鮑菇切丁。','鍋熱油，雞丁煎到金黃。','放杏鮑菇和蒜炒 2 分鐘。','蠔油 1.5 大匙、水 2 大匙炒勻。'],tip:'杏鮑菇口感像肉，可以讓份量變多又便宜。'},
 {id:'meat_egg',n:'肉餅蒸蛋',roles:['main'],lv:1,mem:0,sv:3,use:{mince:1,egg:.2,scallion:.2},sea:['soy','pepper','sesame_oil'],cook:'pot',min:30,
  reheat:'電鍋再蒸 5 分鐘。',steps:['絞肉加醬油 1.5、胡椒粉、麻油、蔥花，往同一個方向攪到有黏性。','壓平在碗裡，中間壓一個凹洞。','打 2 顆蛋在凹洞上。','放電鍋，外鍋 1 杯水。'],tip:'往同一個方向攪，肉餅才會 Q 不會散。'},
 {id:'tteok',n:'韓式炒年糕',roles:['fancy'],lv:1,mem:0,sv:2,use:{rice_cake:.5,cabbage:.2,onion:.33,balls:.5,scallion:.2},sea:['gochujang','sugar','soy'],cook:'fresh',min:20,
  reheat:'現煮最好吃，冷了年糕會變硬。',steps:['年糕泡水 10 分鐘。高麗菜、洋蔥切塊。','平底鍋放水 300ml、韓式辣醬 2、糖 1、醬油 1 大匙，煮滾。','放年糕、火鍋料、洋蔥、高麗菜，中火煮 8 分鐘。','醬汁變稠就好，撒蔥花。'],tip:'韓式辣醬甜甜辣辣，買一罐可以做很多韓式菜。'},
 {id:'shrimp_noodle',n:'蝦仁湯麵',roles:['fancy'],lv:1,mem:0,sv:1,use:{noodle:.25,shrimp_peeled:.4,leafy:.3,egg:.1},sea:['salt','pepper','sesame_oil'],cook:'fresh',min:15,
  reheat:'現煮現吃。',steps:['快煮鍋水滾，先煮麵到 7 分熟。','放蝦仁和青菜，打一顆蛋。','蝦仁變紅就好，加鹽、胡椒、麻油。'],tip:'一鍋到底，快煮鍋最適合的一餐。'},
 {id:'congee',n:'皮蛋瘦肉粥',roles:['fancy'],lv:1,mem:0,sv:2,use:{century_egg:.5,pork_slice:.3,ginger:.2,scallion:.2},sea:['salt','pepper','sesame_oil'],cook:'pot',min:30,
  reheat:'快煮鍋加一點水重新煮滾。',steps:['用備餐的冷飯 1 碗，加水約 800ml 放快煮鍋煮滾。','小火煮 15 分鐘，常常攪才不會黏底。','放肉片、薑絲、切丁的皮蛋，煮 5 分鐘。','鹽、胡椒、麻油調味，撒蔥花。'],tip:'用冷飯煮粥最快，剩飯也不會浪費。'},
 {id:'squid_basil',n:'塔香透抽',roles:['special'],lv:2,mem:0,sv:2,use:{squid:1,basil:1,garlic:.3,chili:.3},sea:['soy','sugar','rice_wine','sesame_oil'],cook:'fresh',min:20,
  reheat:'現炒最好吃，炒太久會硬。',steps:['透抽去內臟，切圈。','鍋放麻油，蒜和辣椒炒香。','透抽大火炒 1 分鐘，醬油 1、米酒 1、糖 1 小匙。','關火放九層塔。'],tip:'透抽炒 1 分鐘就好，多炒會變得跟橡皮筋一樣。'},
 {id:'salmon',n:'香煎鮭魚',roles:['special'],lv:1,mem:0,sv:1,use:{salmon:1,leafy:.3},sea:['salt','pepper'],cook:'fresh',min:15,
  reheat:'當天吃最好。',steps:['鮭魚退冰，紙巾擦乾，兩面撒鹽和胡椒。','平底鍋不放油，皮朝下中小火煎 5 分鐘，鮭魚自己會出油。','翻面再煎 3 分鐘。','旁邊用鮭魚油順便炒一點青菜。'],tip:'鮭魚油脂多，不用另外放油。'},
 {id:'nabeyaki',n:'鍋燒意麵',roles:['fancy'],lv:1,mem:0,sv:1,use:{noodle:.25,egg:.1,balls:.4,leafy:.3,shrimp_peeled:.2},sea:['soy','salt','pepper'],cook:'fresh',min:15,
  reheat:'現煮現吃。',steps:['快煮鍋加水約 600ml，放火鍋料煮滾。','放麵和蝦仁，煮 3 分鐘。','打一顆蛋，放青菜。','醬油 1 大匙、鹽和胡椒調味。'],tip:'台灣小吃店的味道，在宿舍 15 分鐘就能做。'},
 {id:'cong_zhua',n:'蔥抓餅加蛋',roles:['bf'],lv:1,mem:0,sv:1,use:{scallion_pancake:.2,egg:.1},sea:['soy'],cook:'pan',min:8,
  steps:['平底鍋不放油，冷凍蔥抓餅直接下鍋，中火煎 2 分鐘。','翻面，旁邊打一顆蛋。','蛋半熟時把餅蓋上去，再煎 1 分鐘，捲起來。'],tip:'蔥抓餅本身有油，不用另外放。'},
 {id:'mantou_egg',n:'煎饅頭夾蛋',roles:['bf'],lv:1,mem:0,sv:1,use:{mantou:.17,egg:.1,cheese:.08},sea:['oil','salt'],cook:'pan',min:10,
  steps:['饅頭用電鍋或微波加熱，對切。','平底鍋少許油，把饅頭切面煎到金黃。','煎一顆荷包蛋，夾起司一起夾進去。'],tip:'冷凍饅頭放冷凍庫，早上最快的早餐之一。'},
 {id:'yogurt_cup',n:'優格香蕉燕麥杯',roles:['bf'],lv:1,mem:0,sv:1,use:{yogurt:.25,banana:.2,oats:.05},sea:[],cook:'cold',min:3,
  steps:['杯子裡放優格。','鋪香蕉片和一匙燕麥片。','想要甜一點可以加蜂蜜。'],tip:'3 分鐘不用開火，前一晚做好冰著也可以。'},
 {id:'white_rice',n:'電鍋白飯',roles:['staple'],boost:10,lv:1,mem:0,sv:1,use:{},sea:[],cook:'pot',min:40,
  flow:'電鍋煮白飯：2 杯米加 2 杯水，夠吃好幾餐，多的分裝冷凍。',
  reheat:'冷凍的飯微波 2 分鐘，或放電鍋外鍋半杯水。',
  steps:['米用量杯量好，一人一餐大約半杯米。','洗米 2–3 次，水從混濁變得比較清就好，不用洗到全清。','米和水 1:1（新米可以少一點水），放進電鍋內鍋。','外鍋放 1 杯水，按下開關。','跳起來後再燜 10 分鐘，打開用飯匙翻鬆。'],
  tip:'煮好的飯趁熱分裝成一餐一份冷凍，比冷藏好吃很多。'},
 {id:'multigrain_rice',n:'五穀飯',roles:['staple'],boost:1,lv:1,mem:0,sv:1,use:{multigrain:.07},sea:[],cook:'pot',min:90,
  flow:'五穀飯：五穀米先泡 1 小時，水比白飯多一點，用電鍋煮。',
  reheat:'微波 2 分鐘。',
  steps:['五穀米洗一次，泡水 1 小時以上（前一晚泡也可以）。','可以混一半白米，口感比較軟。','米和水 1:1.3，外鍋 1.5 杯水。','跳起來燜 15 分鐘再打開。'],
  tip:'五穀米一定要先泡，不然會硬硬的。'},
 {id:'sweet_potato_rice',n:'地瓜飯',roles:['staple'],boost:1,lv:1,mem:0,sv:1,use:{sweet_potato:.1},sea:[],cook:'pot',min:45,
  flow:'地瓜飯：地瓜切小塊鋪在米上，跟白飯一樣用電鍋煮。',
  reheat:'微波 2 分鐘。',
  steps:['地瓜洗乾淨，連皮切小丁。','米洗好，水照白飯的比例。','地瓜鋪在米上面，不要攪。','外鍋 1 杯水，跳起來燜 10 分鐘後拌勻。'],
  tip:'地瓜不要攪進米裡，煮好再拌，飯才不會糊。'},
 {id:'plain_congee',n:'白粥',roles:['staple'],boost:.6,lv:1,mem:0,sv:1,use:{},sea:[],cook:'pot',min:30,
  flow:'白粥：用煮好的白飯加水，快煮鍋小火煮 15 分鐘。',
  reheat:'加一點水，快煮鍋或微波加熱。',
  steps:['一碗白飯加 3 碗水，放進快煮鍋。','煮滾後轉小火，煮 15 分鐘，常常攪一下才不會黏底。','煮到米粒開花、變濃稠就好。'],
  tip:'用剩飯煮粥最快，配滷肉、肉燥、炒蛋都很好吃。'},
 {id:'yangchun',n:'陽春乾麵',roles:['staple'],boost:.8,lv:1,mem:0,sv:1,use:{noodle:.25,scallion:.1},sea:['soy','sesame_oil'],cook:'fresh',min:10,
  flow:'陽春乾麵：吃那餐再煮，3 分鐘就好。',
  reheat:'現煮現吃。',
  steps:['快煮鍋水滾，麵放進去煮 3 分鐘。','碗裡先放醬油 1 小匙、麻油幾滴。','麵撈起來放進碗裡拌勻，撒蔥花。'],
  tip:'配主菜的醬汁一起拌，就是一碗好吃的乾麵。'},
 {id:'mantou_staple',n:'白饅頭',roles:['staple'],boost:.5,lv:1,mem:0,sv:1,use:{mantou:.33},sea:[],cook:'pot',min:10,
  flow:'饅頭：吃那餐再用電鍋或微波加熱。',
  reheat:'電鍋外鍋半杯水，或微波 1 分鐘（包一張濕紙巾）。',
  steps:['冷凍饅頭不用退冰。','放電鍋，外鍋半杯水，跳起來就好。','用微波的話，饅頭包一張濕紙巾，微波 1 分鐘。'],
  tip:'饅頭配滷肉、肉燥、紅燒的菜最對味。'},
 {id:'danbing',n:'蔥花蛋餅',roles:['bf'],lv:1,mem:0,sv:1,use:{egg_wrap:.1,egg:.1,scallion:.1},sea:['oil','soy'],cook:'pan',min:8,
  steps:['蛋打散，加蔥花和一撮鹽。','平底鍋少許油中火，倒蛋液，馬上把冷凍蛋餅皮蓋上去。','蛋凝固後翻面煎 1 分鐘，捲起來切段，沾醬油。'],tip:'蛋餅皮不用退冰，直接下鍋。'},
 {id:'cheese_danbing',n:'起司玉米蛋餅',roles:['bf'],lv:1,mem:0,sv:1,use:{egg_wrap:.1,egg:.1,cheese:.08,corn_can:.15},sea:['oil'],cook:'pan',min:8,
  steps:['蛋打散，倒進熱鍋，蓋上蛋餅皮。','翻面後鋪起司片和玉米粒。','捲起來壓一下讓起司融化，切段。'],tip:'跟蔥花蛋餅同一個做法，換餡料就是新口味。'},
 {id:'oats',n:'隔夜燕麥',roles:['bf'],lv:1,mem:0,sv:1,use:{oats:.1,milk:.2,banana:.2},sea:[],cook:'cold',min:5,
  steps:['前一晚：燕麥 4 大匙加鮮奶 150ml（用豆漿也可以）放進保鮮盒。','放上香蕉片，蓋好冰一晚。','早上直接吃，想吃熱的就微波 1 分鐘。'],tip:'完全不用開火，前一晚 3 分鐘弄好。'},
 {id:'sweetpotato',n:'電鍋地瓜配水煮蛋',roles:['bf'],lv:1,mem:0,sv:1,use:{sweet_potato:.25,egg:.2},sea:[],cook:'pot',min:5,
  steps:['地瓜洗乾淨，和 2 顆蛋一起放進電鍋。','外鍋 1 杯水，跳起來後燜 10 分鐘。','一次蒸 3–4 天份，冰起來，早上微波就能吃。'],tip:'一次蒸好幾天份，早上最省時間。'},
 {id:'ham_sandwich',n:'火腿蛋三明治',roles:['bf'],lv:1,mem:0,sv:1,use:{toast:.25,egg:.1,ham:.25,cheese:.08},sea:['mayo'],cook:'pan',min:10,
  steps:['平底鍋煎火腿和一顆荷包蛋。','吐司抹美乃滋，夾火腿、蛋、起司。','對切。想吃熱的，吐司也下鍋煎一下。'],tip:'前一晚把火腿和蛋煎好冰著，早上組合就好。'},
 {id:'tuna_onigiri',n:'鮪魚飯糰',roles:['bf'],lv:1,mem:0,sv:1,use:{tuna:.33},sea:['mayo','salt'],cook:'cold',min:10,
  steps:['鮪魚瀝油，加美乃滋拌勻。','手沾一點鹽水，抓一碗飯，中間包鮪魚餡捏緊。','用保鮮膜包好冰起來，早上微波 40 秒。'],tip:'用備餐煮的白飯，順手多捏幾顆。'},
 // 備用新菜：按「加入新菜」時，如果沒辦法請 Claude 想新菜，就從這裡解鎖
 {id:'onion_egg',extra:1,n:'洋蔥炒蛋',roles:['side'],lv:1,mem:0,sv:2,use:{onion:.67,egg:.3},sea:['salt','oil','soy'],cook:'pan',min:10,
  reheat:'微波 1 分鐘，洋蔥越放越甜。',
  steps:['洋蔥切絲，蛋打散。','鍋熱油，蛋炒到半熟盛起。','洋蔥中火炒到軟、微微變透明，大約 4 分鐘。','蛋回鍋，鹽和一點醬油調味。'],
  tip:'洋蔥很便宜又耐放，是備餐的好朋友。'},

function tagOf(r){

  return {m, t:r.cook==='pot'?'K':r.cook==='cold'?'N':'P', f};
}

function balancePenalty(plan){
  let pen=0; const weekFl=new Set();
  for(let si=0;si<2;si++){
    const items=batchOf(plan,si), tg=items.map(tagOf);
    const cnt=(arr)=>arr.reduce((o,x)=>(o[x]=(o[x]||0)+1,o),{});
    for(const v of Object.values(cnt(tg.map(x=>x.m)))) if(v>1) pen+=(v-1)*15;         // 做法重複
    for(const v of Object.values(cnt(tg.map(x=>x.f)))) if(v>1) pen+=(v-1)*9;          // 口味重複
    const tools=cnt([...tg.map(x=>x.t),tagOf(RX[plan.sessions[si].staple]).t].filter(x=>x!=='N'));
    for(const v of Object.values(tools)) if(v>2) pen+=(v-2)*18;                       // 同一個鍋排太多道
    pen-=Object.keys(tools).length*4;                                                  // 鍋子分開用加分
    tg.forEach(x=>weekFl.add(x.f));
  }
  pen-=weekFl.size*3;                                                                  // 一週吃到越多口味越好
  return pen;
}

function weight(S,r){

  const lvl = userLevel(S);

  const c = cooked(S,r.id);
  let w = c===0 ? (r.mem?3:1.7) : c<MASTER ? 3.2 : 1.2;
  if (r.lv===lvl+1 && c===0) w *= .6;

function slotServings(S,si,slot,plan=S.plan){
  const n=prepMeals(S)[si], p=S.settings.people||1;
  if(slot==='staple') return Math.max(0,n-fancyIn(plan,si))*p;
  // 人多的時候大家一起夾，每道菜每人吃少一點：每餐兩道主菜合起來約 1.3 人份、配菜和湯各約 0.75 人份
  if(SLOT_ROLE[slot]==='veg') return n*p;
  if(SLOT_ROLE[slot]!=='main') return p>=5 ? n*p*.75 : n*p;
  if(p<3) return (slot==='main1'?Math.ceil(n/2):Math.floor(n/2))*p;

}

  const seaSet=new Set(); for(const rid of planIds(plan)) RX[rid].sea.forEach(x=>{ if(!S.owned.includes(x)||(S.seaWeek||[]).includes(x)) seaSet.add(x); });

function scorePlan(S,plan){
  const sh=shopping(S,plan);
  // 新調味料超過上限：扣很多分，但不直接淘汰（人多、菜多的時候常常一定會超過）
  const seaOver=Math.max(0,sh.newSea.length-S.settings.maxNewSea);
  let ws=0; for(const id of planIds(plan)) ws+=weight(S,RX[id]);
  const over=sh.total-S.settings.budget;
  const pen=(over>0?over*1.5:Math.max(0,-over-150)*.2) + Math.max(0,sh.cash-S.settings.budget)*.5;
  let rep=0;
  const prot=id=>Object.keys(RX[id].use).find(k=>PROTEIN.includes(k))||'none';
  const mk=SLOTS.filter(k=>SLOT_ROLE[k]==='main');
  const tagged=plan.sessions.flatMap((s,si)=>mk.map(k=>[si,s[k]]));
  const mains=tagged.map(x=>x[1]);
  const ps=mains.map(prot);
  for(let i=0;i<ps.length;i++) for(let j=i+1;j<ps.length;j++) if(ps[i]===ps[j]&&ps[i]!=='none') rep+=(tagged[i][0]===tagged[j][0])?14:6;
  for (const s of plan.sessions){
    const sides=['side','soup'].filter(k=>s[k]).map(k=>prot(s[k]));
    for(const sp of sides) if(sp!=='none'&&mk.some(k=>prot(s[k])===sp)) rep+=12;
    if(s.soup && RX[s.side].soup) rep+=10;
  }
  // 特別的菜（蝦、火鍋、麵）每週一到兩道
  const special=mains.filter(id=>RX[id].roles.includes('special')).length;
  const spMax=mains.length>4?3:2;
  if(special===0) rep+=15; if(special>spMax) rep+=(special-spMax)*10;
  for (const s of plan.sessions) if(mk.filter(k=>RX[s[k]].roles.includes('special')).length>1) rep+=10;
  for (const k of ['pasta','noodle','beef_hotpot','shrimp']) if(mains.filter(id=>RX[id].use[k]).length>1) rep+=8;
  rep+=balancePenalty(plan);
  const fb = S._fridge ? fridgeBonus(plan,S._fridge) : 0;
  return {score: fb + ws*8 - pen - sh.waste*.5 + sh.shared*4 + sh.pantryUse*.3 - rep - sh.newSea.length*5 - seaOver*80, sh};
}
function pick(S,role,exclude,rnd){
  const pool=ACTIVE.filter(r=>fitsRole(r,SLOT_ROLE[role]||role)&&!exclude.has(r.id)).map(r=>[r,weight(S,r)]).filter(x=>x[1]>0);
  let t=pool.reduce((a,b)=>a+b[1],0)*rnd();
  for(const [r,w] of pool){ t-=w; if(t<=0) return r.id; }

}
function randomPlan(S,base,rnd){
  const used=new Set(), locks=base?.locks||{};
  const plan={sessions:[{},{}],locks:{...locks},bf:null};
  for(let si=0;si<2;si++) for(const role of ROLES){
    const k=si+'.'+role; if(locks[k]&&base.sessions[si][role]&&RX[base.sessions[si][role]]){ plan.sessions[si][role]=base.sessions[si][role]; used.add(base.sessions[si][role]); }
  }
  for(let si=0;si<2;si++) for(const role of ROLES){
    if(plan.sessions[si][role]) continue;
    const id=pick(S,role,used,rnd); plan.sessions[si][role]=id; used.add(id);
  }

  const nf=fancyCount(S); plan.fancy=[];
  for(let i=0;i<nf;i++){
    const lk='f.'+i, bfz=base?.fancy?.[i];
    if(locks[lk]&&bfz&&RX[bfz.id]){ plan.fancy.push({...bfz}); used.add(bfz.id); continue; }
    const si = i===0 ? (rnd()<.5?0:1) : 1-plan.fancy[0].si;

}
// 0.5 = 每兩週一次（單週有、雙週沒有）
function fancyCount(S){ const f=S.settings.fancy??.5; return f===.5 ? ((S.weekNo||0)%2===0?1:0) : Math.max(0,Math.min(2,Math.round(f))); }
function rerollFancy(S,plan,i,rnd=Math.random){
  const cur=plan.fancy[i].id, used=new Set(planIds(plan));
  const opts=ACTIVE.filter(r=>r.roles.includes('fancy')&&!used.has(r.id)&&weight(S,r)>0).map(r=>{
    const p=JSON.parse(JSON.stringify(plan)); p.fancy[i].id=r.id; return [scorePlan(S,p).score+rnd()*25, r.id];
  }).sort((a,b)=>b[0]-a[0]);

}
function generate(S,base,rnd=Math.random,tries=600){
  const cands=[];

  if(!cands.length) return randomPlan(S,base,rnd);
  cands.sort((a,b)=>b[0]-a[0]);

}
function rerollSlot(S,plan,si,role,rnd=Math.random){
  const cur=plan.sessions[si][role], used=new Set(planIds(plan));
  const opts=ACTIVE.filter(r=>fitsRole(r,SLOT_ROLE[role]||role)&&!used.has(r.id)&&weight(S,r)>0).map(r=>{
    const p=JSON.parse(JSON.stringify(plan)); p.sessions[si][role]=r.id;
    return [scorePlan(S,p).score + rnd()*25, r.id];
  }).filter(x=>x[0]>-1e8).sort((a,b)=>b[0]-a[0]);
  if(!opts.length) return cur;
  const top=opts.slice(0,4);

}

function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawWheel(items,label,W=wheel){
  const cv=$(W.cv); if(!cv) return;
  W.items=items; if(label!==undefined) W.label=label;
  const size=cv.clientWidth||280, dpr=window.devicePixelRatio||1;
  cv.width=size*dpr; cv.height=size*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  const r=size/2, N=Math.max(items.length,1), a=Math.PI*2/N;
  const fills=['--tomato-soft','--yolk-soft','--leaf-soft','--sky-soft'].map(cssVar);
  const edge=cssVar('--surface'), ink=cssVar('--ink');
  ctx.clearRect(0,0,size,size);
  for(let i=0;i<N;i++){
    const st=-Math.PI/2+i*a;
    ctx.beginPath(); ctx.moveTo(r,r); ctx.arc(r,r,r-2,st,st+a); ctx.closePath();
    ctx.fillStyle=fills[(i+(N%4===1&&i===N-1?1:0))%4]; ctx.fill();
    ctx.strokeStyle=edge; ctx.lineWidth=3; ctx.stroke();
    if(!items[i]) continue;
    ctx.save(); ctx.translate(r,r); ctx.rotate(st+a/2);
    ctx.fillStyle=ink; ctx.textAlign='right'; ctx.textBaseline='middle';
    const fs=Math.max(11,Math.min(14,size/22)); ctx.font=`700 ${fs}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;
    let t=items[i]; if(t.length>7) t=t.slice(0,6)+'…';
    ctx.fillText(t,r-14,0); ctx.restore();
  }
  ctx.beginPath(); ctx.arc(r,r,r-2,0,Math.PI*2); ctx.strokeStyle=cssVar('--line'); ctx.lineWidth=2; ctx.stroke();
  const hub=$(W.hub); if(hub) hub.innerHTML=esc(W.label).replace(/\n/g,'<br>');
}
function spinTo(idx,ms,W=wheel){
  return new Promise(res=>{
    const cv=$(W.cv); if(!cv){res();return;}
    const N=W.items.length, a=360/N;
    const desired=-(idx*a+a/2) + (Math.random()-.5)*a*.6;
    const cur=W.rot, base=cur-(((cur%360)+360)%360);
    let target=base+(((desired%360)+360)%360);
    const turns = ms>1500?4:2;
    while(target<cur+turns*360) target+=360;
    if(!ms||reduced()){ cv.style.transition='none'; W.rot=target; cv.style.transform=`rotate(${target}deg)`; res(); return; }
    cv.style.transition=`transform ${ms}ms cubic-bezier(.15,.7,.15,1)`;
    W.rot=target; cv.style.transform=`rotate(${target}deg)`;
    setTimeout(res,ms+60);
  });
}

  for(let si=0;si<2;si++) for(const role of ROLES){ const k=si+'.'+role; if(!S.plan.locks[k]) order.push({key:k,si,role,get:()=>S.plan.sessions[si][role]}); }

  hidden=new Set(order.map(o=>o.key));
  render();
  const go=S.settings.motion && !reduced();
  for(let i=0;i<order.length;i++){
    const {key,si,role}=order[i], id=order[i].get();
    if(go && !skipSpin){
      const {names,idx}=wheelItems(role,id);
      drawWheel(names,`${si?'第二次':'第一次'}\n${slotLabel(role)}`);
      await spinTo(idx, i===0?2600:1100);

  }

  render();

function flowFor(si){
  const s=S.plan.sessions[si], st=RX[s.staple];
  const items=batchOf(S.plan,si).filter(r=>r.cook!=='fresh'||!isFresh(r));
  const lanes={E:[],K:[],P:[],N:[]};
  const later=[];
  // 主食先放
  const stT=tagOf(st).t;
  if(stT==='E'||stT==='K') lanes[stT].push({r:st,note:'主食'}); else later.push(`主食「${st.n}」想吃那餐再煮，3 分鐘就好。`);
  for(const r of items){
    const t=tagOf(r);
    if(r.cook==='fresh'){ later.push(`「${r.n}」煮好馬上吃最好吃，可以當開伙那天的晚餐，或想吃那天再現做。`); continue; }
    lanes[t.t].push({r});
  }
  // 快煮鍋排太多、電鍋比較空：燉的、煮湯的可以搬到電鍋
  const sum=l=>lanes[l].reduce((a,x)=>a+x.r.min,0);
  for(const x of [...lanes.K]){ const g=tagOf(x.r); if((g.m==='S'||g.m==='T')&&sum('K')>sum('E')+15&&lanes.K.length>1){ lanes.K.splice(lanes.K.indexOf(x),1); lanes.E.push({...x,moved:true}); } }
  const rows=[]; let total=0;
  for(const l of ['E','K','P','N']){ let t=0; for(const x of lanes[l]){ rows.push({at:t,l,x}); t+= l==='N'?Math.min(x.r.min,10):x.r.min; } total=Math.max(total,t); }
  rows.sort((a,b)=>a.at-b.at||'EKPN'.indexOf(a.l)-'EKPN'.indexOf(b.l));
  const seq=[...lanes.E,...lanes.K,...lanes.P,...lanes.N].reduce((a,x)=>a+x.r.min,0);
  const lines=rows.map(({at,l,x})=>`<li><b>${at} 分</b>　${TOOL[l]}：${x.note?'主食 ':''}「${esc(x.r.n)}」（${x.r.min} 分鐘）${x.moved?'<span class="small muted">（快煮鍋排太滿，改用電鍋）</span>':''}</li>`);
  lines.push(`<li><b>${total} 分</b>　全部完成，分裝成幾盒，放涼再冰。</li>`);
  later.forEach(t=>lines.push(`<li>${esc(t)}</li>`));
  (S.plan.fancy||[]).filter(f=>f.si===si).forEach(f=>lines.push(`<li>「${esc(RX[f.id].n)}」是其中一餐的主食，想吃那天再現做。</li>`));
  lines.push(`<li>「${esc(RX[s.veg].n)}」之後每天做一份，5 分鐘。</li>`);
  const usesE=lanes.E.length>0;
  return `<details class="flow"><summary>開伙時間表（三個鍋一起用，大約 ${total} 分鐘）</summary>
    <p class="small muted" style="margin:6px 0 0">${seq>total?`如果一道一道輪流做要 ${seq} 分鐘，同時開工省下 ${seq-total} 分鐘。`:''}${usesE?' 電鍋是共用的，被占用時改用快煮鍋，時間會往後延。':''}${lanes.E.length>1?' 電鍋可以放蒸架，飯在下層、菜在上層一起蒸。':''}</p>
    <ol class="tl">${lines.join('')}</ol></details>`;
}

// ---------- 這週的實際狀況：買了什麼、煮了什麼、吃了什麼 → 冰箱隨時更新
const P=()=>S.settings.people||1;
function planSlots(plan=S.plan){
  const out=[], p=P(), n=si=>prepMeals(S)[si];
  plan.sessions.forEach((s,si)=>SLOTS.forEach(k=>{
    const role=SLOT_ROLE[k], sv=slotServings(S,si,k,plan);
    const meals = role==='main' ? (p<3?(k==='main1'?Math.ceil(n(si)/2):Math.floor(n(si)/2)):n(si)*2/3) : role==='staple' ? Math.max(0,n(si)-fancyIn(plan,si)) : n(si);
    out.push({key:si+'.'+k,id:s[k],role,si,servings:sv,meals});
  }));
  (plan.fancy||[]).forEach((f,i)=>out.push({key:'f.'+i,id:f.id,role:'fancy',si:f.si,servings:p,meals:1}));
  (plan.bf||[]).forEach((id,i)=>out.push({key:'bf.'+i,id,role:'bf',si:0,servings:bfServings(S,i),meals:i===0?4:3}));
  return out;
}
const slotOf=id=>planSlots().find(x=>x.id===id);
const needOf=(id,servings)=>{ const r=RX[id], o={}; if(!r) return o; for(const [k,q] of useOf(S,r)) o[k]=q*servings/r.sv; return o; };
const cookedEv=id=>(S.cookEvents||[]).filter(e=>e.id===id);
const isFresh=r=>r.cook==='fresh'||r.roles.includes('staple')||r.roles.includes('veg')||r.roles.includes('fancy')||r.roles.includes('bf');
function mealsLeft(id){ const made=cookedEv(id).reduce((a,e)=>a+e.meals,0), ate=(S.eaten||{})[id]||0; return Math.max(0,+(made-ate).toFixed(2)); }
function liveFridge(){
  const f={...(S.pantry||{})};
  const add=(k,v)=>{ if(ING[k]) f[k]=(f[k]||0)+v; };
  for(const [k,x] of Object.entries(S.purchases||{})) add(k,x.qty);
  for(const x of S.extras||[]) if(x.id) add(x.id,x.qty);
  for(const e of [...(S.cookEvents||[]),...(S.consumed||[])]) for(const [k,q] of Object.entries(needOf(e.id,e.servings))) add(k,-q);
  for(const [k,v] of Object.entries(S.adjust||{})) add(k,v);
  for(const k of Object.keys(f)){ if(!(f[k]>0.05)) delete f[k]; else f[k]=+f[k].toFixed(2); }
  return f;
}
function missingFor(id,servings,fridge){ const out=[]; for(const [k,q] of Object.entries(needOf(id,servings))){ if(GARNISH.has(k)) continue; if((fridge[k]||0)<q*0.6) out.push(k); } return out; }

const lackGarnish=id=>RX[id]?Object.keys(RX[id].use).filter(k=>GARNISH.has(k)&&(S.unavail||[]).includes(k)):[];
function fridgeBonus(plan,fridge){
  let b=0; for(const id of planIds(plan)){ const r=RX[id]; const ess=Object.keys(r.use).filter(k=>!GARNISH.has(k)); if(!ess.length) continue;
    b+=ess.filter(k=>(fridge[k]||0)>0.2).length/ess.length*25; }

}

function replanFromFridge(){
  const locks={...S.plan.locks};
  for(const x of planSlots()) if(cookedEv(x.id).length||((S.eaten||{})[x.id]||0)>0) locks[x.key]=true;
  S._fridge=liveFridge(); S.pantryBackup=S.pantry; S.pantry=S._fridge;   // 用現在的冰箱算還要買什麼
  const before=planIds(S.plan);
  const p=generate(S,{...S.plan,locks});
  S.pantry=S.pantryBackup; delete S.pantryBackup; delete S._fridge;
  p.locks=S.plan.locks; S.plan=p;
  const changed=planIds(p).filter(id=>!before.includes(id)).length;
  S.skipped=(S.skipped||[]).filter(id=>planIds(p).includes(id));
  save(); render(); toast(changed?`換了 ${changed} 道還沒煮的菜，優先用冰箱裡有的`:'現在的菜單已經是最好的安排');
}

function finishWeek(){
  const ticked=new Set([...document.querySelectorAll('[data-wk]')].filter(x=>x.checked).map(x=>x.dataset.wk));
  const spend=spendNow();
  // 結算時補勾的：算煮了一次（現做的菜如果已經在第二輪按過「吃了」，材料已經扣過，不重複扣）
  for(const id of ticked) if(!cookedEv(id).length){
    const sl=slotOf(id), r=RX[id], ateFresh=isFresh(r)&&((S.eaten||{})[id]||0)>0;
    S.cookEvents.push({id, servings: ateFresh?0:(sl?sl.servings:P()), meals: sl?sl.meals:1, date:iso(new Date())});
    const b=cooked(S,id); S.progress[id]={c:b+1,last:iso(new Date())};
  }
  const times={}; for(const e of S.cookEvents) times[e.id]=(times[e.id]||0)+1;
  const ups=[];
  for(const [id,n] of Object.entries(times)){
    if(!RX[id]) continue;
    const after=cooked(S,id), before=Math.max(0,after-n);
    if(stageOf(after)!==stageOf(before)) ups.push({id,n:RX[id].n,from:stageOf(before),to:stageOf(after)});
  }
  const fridge=liveFridge(); S.pantry={}; for(const [k,v] of Object.entries(fridge)) if(keeps(k)&&v>=0.1) S.pantry[k]=v;
  const end=iso(new Date());
  const rec={start:S.weekStart||end, end, spent:spend.total, estimated:spend.estimated, budget:S.settings.budget, people:P(),
    cooked:Object.entries(times).filter(([id])=>RX[id]).map(([id,n])=>({id,n:RX[id].n,times:n})),
    ups, pantry:Object.entries(S.pantry).filter(([k])=>ING[k]).map(([k,v])=>({n:ING[k][0],v})),
    extras:(S.extras||[]).map(x=>({n:x.name,paid:x.paid}))};
  const prevMonth = S.history.length ? S.history[S.history.length-1].end.slice(0,7) : null;
  S.history=[...(S.history||[]),rec].slice(-104);
  S.lastWeek=planIds(S.plan);
  Object.assign(S,{weekLog:[],seaWeek:[],purchases:{},extras:[],receipt:null,unavail:[],cookEvents:[],consumed:[],eaten:{},skipped:[],adjust:{},checked:{},today:null,weekStart:end,weekNo:(S.weekNo||0)+1});
  S.plan=null; S.plan=generate(S,null);
  save(); closeSheet(); tab='spin'; mode='week'; render(); window.scrollTo(0,0);
  const newMonth = prevMonth && prevMonth!==end.slice(0,7);
  openReport(weekReportHTML(rec) + (newMonth?monthReportHTML(prevMonth):''), true);
}

function monthReportHTML(month){
  const weeks=(S.history||[]).filter(w=>w.end.slice(0,7)===month);
  if(!weeks.length) return '';
  const spent=weeks.reduce((a,w)=>a+w.spent,0), times=weeks.reduce((a,w)=>a+w.cooked.reduce((x,c)=>x+c.times,0),0);
  const dishes=new Map(); weeks.forEach(w=>w.cooked.forEach(c=>dishes.set(c.n,(dishes.get(c.n)||0)+c.times)));
  const ups=weeks.flatMap(w=>w.ups), masters=ups.filter(u=>u.to===3);
  const prevKey=(()=>{ const y=+month.slice(0,4), m=+month.slice(5,7); return m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`; })();
  const prev=(S.history||[]).filter(w=>w.end.slice(0,7)===prevKey);

  const mx=Math.max(...weeks.map(w=>Math.max(w.spent,w.budget)),1);
  const top=[...dishes.entries()].sort((a,b)=>b[1]-a[1]);
  return `<section class="report month">

    <div class="bars" aria-label="每週花費">${weeks.map(w=>`<div class="barcol"><span class="num small">${Math.round(w.spent)}</span><i style="height:${Math.round(w.spent/mx*80)}px;background:${w.spent>w.budget?'var(--tomato)':'var(--leaf)'}"></i><span class="small muted">${md(w.end)}</span></div>`).join('')}</div>

    ${top.length?`<div><h3>最常煮的</h3><p class="small" style="margin:4px 0 0">${top.slice(0,5).map(([n,c])=>`${esc(n)} ${c} 次`).join('、')}</p></div>`:''}
  </section>`;
}

function logCook(id){

function confetti(cv){
  const box=cv.parentElement, w=box.clientWidth, h=box.clientHeight, dpr=window.devicePixelRatio||1;
  cv.width=w*dpr; cv.height=h*dpr; const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const cols=['--tomato','--yolk-bright','--leaf','--sky'].map(cssVar);
  const ps=Array.from({length:70},()=>({x:w/2,y:h*.3,vx:(Math.random()-.5)*9,vy:-Math.random()*8-3,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*4)],a:Math.random()*6}));
  let t=0; (function f(){ ctx.clearRect(0,0,w,h); ps.forEach(p=>{ p.vy+=.28; p.x+=p.vx; p.y+=p.vy; p.a+=.2; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); }); if(++t<110 && document.body.contains(cv)) requestAnimationFrame(f); else ctx.clearRect(0,0,w,h); })();
}
function slotMachine(key,finalName){
  const b=$('#dn-'+key.replace('.','-')); if(!b) return;
  if(reduced()){ return; }
  const names=ACTIVE.map(r=>r.n); let i=0;
  const iv=setInterval(()=>{ b.textContent=names[Math.floor(Math.random()*names.length)]; if(++i>9){ clearInterval(iv); b.textContent=finalName; b.classList.add('pop'); } },60);
}

    case 'btnNewWeek': openWrapUp(); return;
    case 'btnWrapOk': finishWeek(); return;
    case 'btnHelp': case 'btnHelp2': openHelp(); return;
    case 'btnAskGo': askGo(); return;
    case 'peopleDn': case 'peopleUp': {
      const p=Math.max(1,Math.min(5,(S.settings.people||1)+(t.id==='peopleUp'?1:-1)));
      if(p===(S.settings.people||1)) return;
      S.settings.people=p; S.settings.budget=BUDGET_HINT[p]; rebuild(S); S.plan=generate(S,null); S.checked={}; S.today=null;
      save(); render(); toast(`改成 ${p} 人份，預算建議 ${BUDGET_HINT[p].toLocaleString('en-US')} 元，菜單重新抽好了`); return; }
    case 'mealsDn': S.settings.meals=Math.max(4,(S.settings.meals||8)-1); S.plan=generate(S,S.plan); save(); render(); return;
    case 'mealsUp': S.settings.meals=Math.min(14,(S.settings.meals||8)+1); S.plan=generate(S,S.plan); save(); render(); return;
    case 'btnAte': ateToday(); return;
    case 'btnUndoAte': undoAte(); return;
    case 'btnReplan': replanFromFridge(); return;
    case 'btnSugAgain': if(window._lastSug) openSuggest(window._lastSug); return;
    case 'btnExtra': {
      const id=$('#exId').value, name=id?ING[id][0]:($('#exName').value||'').trim(), qty=Math.max(1,Math.round(+$('#exQty').value||1)), paid=Math.max(0,Math.round(+$('#exPaid').value||0));
      if(!name){ toast('請選食材，或在「名稱」填你買了什麼'); return; }
      S.extras=[...(S.extras||[]),{id:id||null,name,qty,paid}]; if(id&&paid) S.prices[id]=Math.round(paid/qty); save(); render();
      if(id) openSuggest({title:`你買了${name}！`,intro:'這些菜會用到它，按一下就換進這週菜單：',prefer:id});
      else toast(`記下來了：${name} ${money(paid)}`);
      return; }
    case 'btnBackup': exportBackup(); return;
    case 'btnRestore': $('#restoreFile').click(); return;
    case 'btnReset': if(!resetArmed){ resetArmed=true; render(); return; } resetArmed=false; S=defaultState(); save(); render(); toast('已清除'); return;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='restoreFile'&&t.files&&t.files[0]){ importBackup(t.files[0]); t.value=''; return; }
  if(t.dataset.buy){
    const key=t.dataset.buy;
    if(t.checked) S.purchases={...(S.purchases||{}),[key]:{qty:+t.dataset.q||1,paid:Math.round(+t.dataset.est||0)}};
    else { const c={...S.purchases}; delete c[key]; S.purchases=c; }
    if(key.startsWith('sea_')){ const id=key.slice(4);
      if(t.checked){ if(!S.owned.includes(id)) S.owned.push(id); if(!S.seaWeek.includes(id)) S.seaWeek.push(id); }
      else { S.owned=S.owned.filter(x=>x!==id); S.seaWeek=S.seaWeek.filter(x=>x!==id); } }
    save(); render(); return; }
  if(t.dataset.paid){ const k=t.dataset.paid, x=S.purchases[k]; if(!x) return; x.paid=Math.max(0,Math.round(+t.value||0)); if(ING[k]&&x.qty) S.prices[k]=Math.round(x.paid/x.qty); save(); render(); return; }
  if(t.dataset.receipt){ const v=Math.round(+t.value||0); S.receipt=v>0?v:null; save(); render(); return; }
  if(t.dataset.price){ S.prices[t.dataset.price]=Math.max(0,Math.round(+t.value||0)); save(); render(); return; }
  if(t.dataset.set){ S.settings[t.dataset.set]=Math.max(0,+t.value||0); save(); render(); return; }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeSheet(); $('#celebrateRoot').innerHTML=''; } });
const redrawWheels=()=>{ if(tab!=='spin') return; if(mode==='day') drawWheel(wheel2.items,undefined,wheel2); else drawWheel(wheel.items); };
window.addEventListener('resize',redrawWheels);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',redrawWheels);
new MutationObserver(redrawWheels).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

// ---------- 啟動
const local=loadLocal(); if(local) S=merge(local);
if(local && local.appVersion!==APP_VERSION){ try{ autoBackupIfUpgraded(JSON.stringify(local),local.appVersion); }catch(e){} }
S.appVersion=APP_VERSION; if(local) save();
if(!(local&&local.settings&&local.settings.fancyV===2)){ S.settings.fancy=.5; S.settings.fancyV=2; save(); }
if(!S.weekStart){ S.weekStart=iso(new Date()); save(); }
render();
setSync(S.lastBackup?`紀錄存在這支手機。上次備份：${S.lastBackup}`:'紀錄存在這支手機，記得偶爾到「設定」備份');
document.fonts?.ready?.then(redrawWheels);
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
